<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Dark charcoal background -->
  <rect width="48" height="48" rx="10" fill="#17191D"/>
  <!-- Geometric AZ monogram with metallic gold -->
  <!-- A: left diagonal stroke -->
  <path d="M9 36 L18 12 L22 12 L14 36 Z" fill="#C9A64B"/>
  <!-- A: right diagonal stroke -->
  <path d="M18 12 L27 36 L23 36 L15 12 Z" fill="#E8D28A"/>
  <!-- A: crossbar -->
  <rect x="12" y="26" width="11" height="3" rx="1" fill="#C9A64B"/>
  <!-- Z: top bar -->
  <rect x="27" y="12" width="12" height="3" rx="1" fill="#C9A64B"/>
  <!-- Z: diagonal -->
  <path d="M39 12 L27 33 L39 33 L27 15 Z" fill="#E8D28A" opacity="0.9"/>
  <!-- Z: bottom bar -->
  <rect x="27" y="33" width="12" height="3" rx="1" fill="#C9A64B"/>
  <!-- Gold accent line across bottom -->
  <rect x="9" y="39" width="30" height="1.5" rx="0.75" fill="url(#goldLine)"/>
  <defs>
    <linearGradient id="goldLine" x1="9" y1="39" x2="39" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9A64B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8D28A"/>
      <stop offset="100%" stop-color="#C9A64B" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

